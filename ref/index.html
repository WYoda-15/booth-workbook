<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업용 레퍼런스 여섯 가지</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box;margin:0}
body{background:#17181B;color:#E7E4DC;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:28px 18px 60px;line-height:1.6}
main{max-width:980px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:6px}
h1 em{font-style:normal;color:#F08A5D}
p.lede{color:#A9A59C;margin-bottom:22px}
h2{font-size:1.2rem;margin:26px 0 12px;padding-left:12px;border-left:4px solid #F08A5D}
h2 small{font-weight:400;font-size:.9rem;color:#A9A59C;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.it{background:#1F2126;border:1px solid #3A3D45;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.it iframe{width:100%;height:420px;border:0;background:#fff;pointer-events:none}
.it div{padding:14px 16px 16px;display:grid;gap:8px}
.it b{font-size:1.1rem}
.it small{color:#A9A59C}
.it code{display:block;background:#17181B;border:1px dashed #A9A59C;border-radius:8px;padding:8px 10px;font-size:.8rem;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap}
a.btn,button{font:inherit;font-size:.9rem;padding:.45em 1em;border-radius:10px;border:1px solid #F08A5D;color:#F08A5D;background:none;text-decoration:none;cursor:pointer}
button.on{background:#F08A5D;color:#17181B}
.rule{margin-top:26px;border-left:4px solid #F08A5D;background:#1F2126;padding:12px 16px;border-radius:0 10px 10px 0}
</style>
</head>
<body>
<main>
 <h1>수업용 <em>레퍼런스 여섯 가지</em></h1>
 <p class="lede">참고할 사이트를 정하지 못한 팀은 이 가운데 하나를 고릅니다. 주소를 복사해서 교재의 "참고할 화면의 주소"에 붙여 넣습니다.</p>
 <h2>프로그램 화면 <small>누르면 바뀌는 도구</small></h2>
 <div class="grid" id="g"></div>
 <h2>웹사이트 화면 <small>읽고 둘러보는 페이지</small></h2>
 <div class="grid" id="g2"></div>
 <p class="rule">가져오는 것은 배치, 색, 글자의 분위기까지입니다. 다른 사이트를 참고할 때는 그 사이트의 로고, 사진, 문구를 가져오지 않습니다. 이 여섯 화면은 수업용으로 만든 것이라 자유롭게 참고해도 됩니다.</p>
</main>
<script>
const R=[['neon.html','1 · 네온 오락실','어두운 바탕, 빛나는 선, 큰 숫자, 순위표'],['paper.html','2 · 종이 영수증','종이 색 바탕, 점선과 도장, 타자기 숫자'],['soft.html','3 · 부드러운 카드','밝은 바탕, 둥근 카드, 알약 모양 버튼']];
const W=[['poster.html','4 · 축제 포스터','남색과 노랑, 아주 큰 제목, 번호가 붙은 순서, 한눈에 보는 숫자'],['zine.html','5 · 잡지 한 쪽','종이 색 바탕, 명조 제목, 가는 선, 점선으로 이은 차림표'],['ticket.html','6 · 입장권과 시간표','짙은 초록 바탕, 입장권 모양 머리, 세로 시간표, 아래에 붙은 버튼']];
const card=r=>{const u=new URL(r[0],location.href).href;return `<div class="it"><iframe src="${r[0]}" title="${r[1]}" loading="lazy"></iframe><div><b>${r[1]}</b><small>${r[2]}</small><code>${u}</code><div class="row"><button type="button" data-u="${u}">주소 복사</button><a class="btn" href="${r[0]}" target="_blank" rel="noopener">크게 열기</a></div></div></div>`};
document.getElementById('g').innerHTML=R.map(card).join(''); document.getElementById('g2').innerHTML=W.map(card).join('');
document.addEventListener('click',async e=>{const b=e.target.closest('[data-u]'); if(!b) return; try{await navigator.clipboard.writeText(b.dataset.u)}catch(x){const t=document.createElement('textarea');t.value=b.dataset.u;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()} b.classList.add('on'); b.textContent='복사했습니다'; setTimeout(()=>{b.classList.remove('on');b.textContent='주소 복사'},1500)});
</script>
</body>
</html>
