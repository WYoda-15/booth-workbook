<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아 코인 지갑 · 수업용 레퍼런스 3</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg1:#eef1ff;--bg2:#fdf0f6;--card:#fff;--ink:#23243a;--dim:#8a8ca6;--v:#6c5ce7;--mint:#3ecfa8;--pink:#ff8fb1}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:22px 16px 44px}
.wrap{max-width:460px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px}
header h1{font-size:1.25rem;font-weight:800}
header h1 span{color:var(--v)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--v));box-shadow:0 6px 14px rgba(108,92,231,.35)}
.card{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 12px 30px rgba(80,80,140,.12)}
.hero{background:linear-gradient(135deg,var(--v),#9b8cff);color:#fff;box-shadow:0 18px 34px rgba(108,92,231,.4)}
.hero small{opacity:.85;font-size:.9rem}
.hero b{display:block;font-size:3.6rem;font-weight:800;letter-spacing:-.03em;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.hero b i{font-style:normal;font-size:1.3rem;font-weight:600;margin-left:6px;opacity:.9}
.chips{display:flex;gap:8px}
.chips span{background:rgba(255,255,255,.22);padding:7px 14px;border-radius:999px;font-size:.85rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini b{display:block;font-size:1.6rem;font-weight:800;margin-top:6px}
.mini small{color:var(--dim)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.prog{height:12px;border-radius:999px;background:#eceefb;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:68%;border-radius:999px;background:linear-gradient(90deg,var(--mint),#7be3c7)}
ul{list-style:none;padding:0;display:grid;gap:12px}
ul li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem;background:#f1f0ff}
ul li small{display:block;color:var(--dim);font-size:.8rem}
.plus{color:var(--mint);font-weight:800}.minus{color:var(--pink);font-weight:800}
button{font:inherit;font-weight:800;font-size:1.1rem;color:#fff;background:var(--ink);border:0;border-radius:999px;padding:17px;width:100%;box-shadow:0 12px 24px rgba(35,36,58,.28);cursor:pointer}
button:active{transform:scale(.98)}
footer{text-align:center;color:var(--dim);font-size:.75rem}
</style>
</head>
<body>
<div class="wrap">
 <header><h1><span>모아</span> 코인 지갑</h1><div class="avatar"></div></header>
 <section class="card hero"><small>지금 가진 코인</small><b>1,250<i>코인</i></b><div class="chips"><span>오늘 +300</span><span>부스 4곳 방문</span></div></section>
 <section class="row">
  <div class="card mini"><small><span class="dot" style="background:var(--mint)"></span>모은 도장</small><b>7 / 10</b><div class="prog"><i></i></div></div>
  <div class="card mini"><small><span class="dot" style="background:var(--pink)"></span>쓸 수 있는 쿠폰</small><b>2장</b><div class="prog"><i style="width:40%;background:linear-gradient(90deg,var(--pink),#ffc2d4)"></i></div></div>
 </section>
 <section class="card"><ul>
  <li><div class="ic">●</div><div>밸런스 게임 참여<small>방금 전</small></div><span class="plus">+100</span></li>
  <li><div class="ic">◆</div><div>굿즈 교환<small>12분 전</small></div><span class="minus">−250</span></li>
  <li><div class="ic">▲</div><div>퀴즈 정답<small>30분 전</small></div><span class="plus">+200</span></li>
 </ul></section>
 <button type="button">코인 쓰러 가기</button>
 <footer>수업용 레퍼런스 3 · 부드러운 카드 · 자유롭게 참고해도 됩니다</footer>
</div>
</body>
</html>
