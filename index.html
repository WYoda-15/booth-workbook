<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 특강 교재</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17181B;--panel:#1F2126;--panel2:#282B32;--line:#3A3D45;--text:#E7E4DC;--dim:#A9A59C;--acc:#F08A5D;--quiz:#EBCB78;--ok:#7FC99A;--bad:#E79090;
  --f-d:"Black Han Sans","IBM Plex Sans KR",sans-serif;--f-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-b);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:.55em 1em;min-height:46px}
button:hover{border-color:var(--dim)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.pill{font-size:.78rem;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:.2em .8em;white-space:nowrap}
.pill.db{color:var(--ok);border-color:var(--ok)}
#banner{display:none;background:#4a2a22;color:#ffd9cc;padding:.6em 1em;text-align:center;font-size:.9rem}
#banner.on{display:block}

/* 들어가기 */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 0}
#login .box{width:min(560px,100% - 40px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px}
#login h1{font-family:var(--f-d);font-weight:400;font-size:2.1rem;margin:0 0 .2em;line-height:1.2}
#login h1 em{font-style:normal;color:var(--acc)}
#login p{color:var(--dim);margin:.2em 0 1.4em}
.lab{display:block;font-weight:700;margin:1.2em 0 .5em}
#teamSel{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
#teamSel button{display:grid;gap:0;padding:.5em .3em;font-weight:700;font-size:1.1rem}
#teamSel button small{font-weight:400;font-size:.72rem;color:var(--dim)}
#teamSel button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#1b1410}
#teamSel button[aria-pressed=true] small{color:#3a2416}
#nameIn{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.7em .9em;font-size:1.1rem}
#enter{width:100%;margin-top:1.4em;background:var(--acc);border-color:var(--acc);color:#1b1410;font-weight:700;font-size:1.15rem;min-height:56px}
#loginMsg{color:var(--quiz);min-height:1.4em;margin-top:.8em;font-size:.9rem}
#tmenu{margin-top:1.2em;border-top:1px solid var(--line);padding-top:1em;color:var(--dim);font-size:.9rem}
#tmenu summary{cursor:pointer}
#tmenu .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:.8em}
#tmenu input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5em .7em;width:9em}
#tN{font-weight:700;color:var(--text);min-width:3.2em;text-align:center}

/* 위쪽 막대 */
#app{display:none;min-height:100vh;padding-bottom:80px}
#app.on{display:block}
#bar{position:sticky;top:0;z-index:5;background:rgba(23,24,27,.96);border-bottom:1px solid var(--line)}
#bar .wrap{display:flex;gap:10px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
#teamChip{font-family:var(--f-d);font-size:1.3rem;color:var(--acc);white-space:nowrap}
#booth{flex:1 1 160px;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:.25em .1em;font-weight:700}
#booth::placeholder{color:var(--dim);font-weight:400}
#who{color:var(--dim);font-size:.85rem;white-space:nowrap}
#score{font-weight:700;color:var(--quiz);border:1px solid var(--quiz);border-radius:99px;padding:.15em .8em;font-size:.85rem;white-space:nowrap}
#bar button{min-height:38px;padding:.3em .8em;font-size:.85rem}

/* 지금 무엇을 하는지 */
#mode{margin:18px 0 0;border-radius:16px;padding:18px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:2px solid var(--acc);background:#2a211c}
#mode .no{font-family:var(--f-d);font-size:2.4rem;line-height:1;color:var(--acc)}
#mode .tt{flex:1 1 200px;min-width:0}
#mode .tt b{display:block;font-family:var(--f-d);font-weight:400;font-size:1.6rem;line-height:1.25}
#mode .tt span{color:var(--dim);font-size:.9rem}
#mode.quiz{border-color:var(--quiz);background:#2a2619}
#mode.quiz .no{color:var(--quiz)}
#mode.watch{border-color:var(--line);background:var(--panel)}
#mode.watch .no{color:var(--dim)}
#followBtn{background:var(--acc);border-color:var(--acc);color:#1b1410;font-weight:700}

#main{margin-top:18px}
.goal{font-size:1.05rem;margin:0 0 18px}
.watchbox{text-align:center;padding:64px 20px;color:var(--dim)}
.watchbox b{display:block;font-family:var(--f-d);font-weight:400;font-size:2rem;color:var(--text);margin-bottom:.3em}

/* 읽는 것 */
.guide{color:var(--dim);margin:0 0 16px}
.guide p{margin:0 0 .8em;color:var(--text)}
.guide .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 28px}
.guide h4{margin:0 0 .2em;font-size:.82rem;font-weight:700;color:var(--dim)}
.guide ul{margin:0;padding-left:1.1em}
.guide li{margin:.15em 0}
.gsteps{margin:.2em 0 1em;padding:14px 16px 14px 2.4em;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px}
.gsteps li{margin:.3em 0 .9em}
.gsteps li:last-child{margin-bottom:.2em}
.gsteps small{display:block;color:var(--dim);font-size:.86rem;line-height:1.5}
.shot{display:block;position:relative;width:100%;max-width:680px;margin:.5em 0 0;padding:0;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto}
.shot span{position:absolute;right:8px;top:8px;background:rgba(23,24,27,.82);color:var(--text);font-size:.7rem;border-radius:99px;padding:.05em .7em;opacity:.9}
.write .shot{margin:0 0 10px}
.shotcap{color:var(--dim);font-size:.88rem;margin:0 0 8px}
#lb{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.94);display:none;place-items:center;padding:14px;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:calc(100vh - 28px);border-radius:8px;background:#fff}
.pparts{margin:0 0 10px}
.pparts p{margin:0 0 6px;color:var(--dim);font-size:.86rem}
.pchips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{min-height:38px;padding:.2em .9em;font-size:.88rem;border-radius:99px;border-style:dashed}
.pchip::before{content:"+ ";color:var(--acc)}
.pchip[aria-pressed=true]{border-style:solid;border-color:var(--ok);color:var(--ok);background:#1d2a22}
.pchip[aria-pressed=true]::before{content:"✓ ";color:var(--ok)}
#pace{flex:1 1 100%;margin:0;color:var(--quiz);font-size:.92rem}
#roomChip{font-size:.78rem;font-weight:700;color:#1b1410;background:var(--quiz);border-radius:99px;padding:.15em .8em;white-space:nowrap}
#roomNote{margin:0 0 1em!important;padding:10px 14px;border-radius:10px;background:#2a2619;border:1px solid var(--quiz);color:var(--quiz)!important;font-size:.9rem}
.showbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:0 0 16px}
.showbox div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--dim)}
.showbox b{display:block;font-family:var(--f-d);font-weight:400;font-size:1.3rem;color:var(--text)}

/* 쓰는 것: 모두 같은 모양 */
.write{background:var(--panel2);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.write .wl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.write .wl b{background:var(--acc);color:#1b1410;border-radius:6px;padding:.05em .55em;font-size:.82rem;white-space:nowrap}
.write .wl strong{font-size:1.08rem}
.write .wl i{font-style:normal;color:var(--dim);font-size:.82rem}
.write textarea,.write input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.7em .85em;line-height:1.6;resize:vertical;min-height:52px}
.write .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.write .row button,.rowb button{min-height:40px;font-size:.88rem;padding:.3em .9em}
.saved{color:var(--ok);font-size:.82rem;margin-left:auto}
details{border:1px solid var(--line);border-radius:12px;margin:0 0 14px;background:var(--panel)}
summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style-position:inside}
summary span{font-weight:400;color:var(--dim);font-size:.85rem;margin-left:.6em}
details>div{padding:0 16px 14px}
details.task{background:transparent}
details.task>summary{font-size:1.15rem;background:var(--panel);border-radius:12px}
details.task[open]>summary{border-radius:12px 12px 0 0;border-bottom:1px solid var(--line)}
details.task>.tb{padding:16px 0 0}
.peer{border-top:1px solid var(--line);padding:10px 0}
.peer b{font-size:.88rem}
.peer p{white-space:pre-wrap;margin:.3em 0 .5em;color:var(--dim)}
.peer button{min-height:38px;font-size:.85rem;padding:.25em .8em}
pre.refp{white-space:pre-wrap;font-family:var(--f-b);margin:0;color:var(--dim)}
.locked{color:var(--dim);font-size:.9rem;padding:0 16px 14px}

/* 누르는 것 */
.opts{display:grid;gap:10px;margin:0 0 14px}
.opts button{display:flex;gap:14px;align-items:center;text-align:left;font-size:1.1rem;padding:.8em 1em;min-height:62px;border-width:2px}
.opts button b{font-family:var(--f-d);font-weight:400;font-size:1.4rem;color:var(--dim);min-width:1.4em}
.opts button.sel{border-color:var(--acc);background:#2a211c}
.opts button.sel b{color:var(--acc)}
.opts button.ok{border-color:var(--ok);background:#1d2a22}
.opts button.ok b{color:var(--ok)}
.opts button.no{border-color:var(--bad);background:#2c1f1f}
.qq{font-size:1.35rem;font-weight:700;margin:0 0 14px;line-height:1.5}
.quote{border-left:4px solid var(--quiz);background:var(--panel);padding:12px 16px;border-radius:0 10px 10px 0;margin:0 0 14px}
#qmsg{min-height:1.6em;font-weight:700}
#qmsg.ok{color:var(--ok)}#qmsg.no{color:var(--bad)}
.checks{display:grid;gap:10px}
.checks button{display:flex;gap:12px;align-items:center;text-align:left;min-height:58px;border-width:2px}
.checks button::before{content:"";flex:none;width:26px;height:26px;border:2px solid var(--dim);border-radius:7px}
.checks button[aria-pressed=true]{border-color:var(--ok);background:#1d2a22}
.checks button[aria-pressed=true]::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 5px #1d2a22}
.hint{color:var(--dim);font-size:.9rem;margin:10px 0 0}
.missions{display:grid;gap:12px;margin:0 0 14px}
.ms{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ms.ok{border-color:var(--ok)}
.ms .mh{display:flex;gap:12px;align-items:baseline}
.ms .mh b{font-family:var(--f-d);font-weight:400;font-size:1.7rem;color:var(--acc)}
.ms .mh strong{font-size:1.15rem}
.ms p{margin:.3em 0 .6em;color:var(--text)}
.exnote{margin:0 0 12px;padding:10px 14px;border-radius:10px;background:#2a2619;border:1px solid var(--quiz);color:var(--quiz);font-size:.92rem}
.ms small{display:block;color:var(--dim);font-size:.8rem;margin-bottom:4px}
.ms .say{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px dashed var(--dim);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ms .say:last-child{margin-bottom:0}
.ms .say span{flex:1;min-width:0}
.ms .say button{min-height:38px;font-size:.85rem;padding:.2em .8em;flex:none}
.ms .done{width:100%;border-width:2px;font-weight:700}
.ms .done[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#10261a}

/* 2주차: 주소 확인, 프로그램 올리기, 자료 묶음 */
.pmsg{font-size:.9rem}
.pmsg.ok{color:var(--ok)}.pmsg.bad{color:var(--bad)}.pmsg.run{color:var(--quiz)}
.appv{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--ok);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.appv.none{border-color:var(--line);color:var(--dim)}
.appv .qr{background:#fff;border-radius:10px;padding:8px;line-height:0;flex:none}
.appv .qr svg{width:148px;height:148px;display:block}
.appv .ai{flex:1 1 240px;min-width:0}
.appv .ai b{display:block;font-size:1.05rem}
.appv .ai a{color:var(--acc);word-break:break-all;font-size:.9rem}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.cwarn{color:var(--quiz);font-size:.88rem;margin:8px 0 0;white-space:pre-line}
.cwarn:empty{display:none}
.filebtn{display:inline-flex;align-items:center;min-height:40px;font-size:.88rem;padding:.3em .9em;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;color:var(--text);text-decoration:none}
.appv .ai a.filebtn{color:var(--text);font-size:.88rem}
.glinks{margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.glinks a.filebtn{border-color:var(--acc);color:var(--acc)}
label.filebtn.pri,button.pri{border-color:var(--acc);background:var(--acc);color:#1b1c1f;font-weight:700}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.tapbig{width:100%;min-height:200px;font-family:var(--f-d);font-size:3rem;background:var(--acc);border-color:var(--acc);color:#1b1410;border-radius:20px;touch-action:manipulation}
.tapbig:active{transform:scale(.985)}
#tapN{text-align:center;font-size:1.2rem;font-weight:700;margin:14px 0}
.applist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 16px}
.applist a,.applist span{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--text);background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.applist b{color:var(--acc);margin-right:.5em}
.applist span{opacity:.5}
.bparts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.bparts span{font-size:.82rem;border:1px solid var(--line);border-radius:99px;padding:.1em .7em;color:var(--dim)}
.bparts span.y{color:var(--ok);border-color:var(--ok)}
.void{border:2px solid var(--bad);background:#2c1f1f;color:var(--bad);border-radius:12px;padding:12px 16px;font-weight:700;margin:0 0 14px}

/* 퀴즈 입장 */
#qgate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center;padding:24px;text-align:center}
#qgate.on{display:grid}
#qgate .box{max-width:600px}
#qgate h2{font-family:var(--f-d);font-weight:400;font-size:2.6rem;color:var(--quiz);margin:0 0 .3em;line-height:1.2}
#qgate p{color:var(--dim);margin:.3em 0}
#qgate button{margin-top:1.2em;min-height:72px;font-size:1.4rem;font-weight:700;padding:.5em 2em;background:var(--quiz);border-color:var(--quiz);color:#1b1410}

/* 실습 목록 */
#list{position:fixed;inset:0;z-index:20;background:rgba(10,10,12,.7);display:none}
#list.on{display:block}
#list .sheet{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto}
#list h2{font-family:var(--f-d);font-weight:400;margin:0 0 .6em;font-size:1.5rem}
#list h3{margin:1.2em 0 .4em;font-size:.85rem;color:var(--dim)}
#list .it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:6px;min-height:48px}
#list .it b{font-family:var(--f-d);font-weight:400;color:var(--acc);min-width:2em}
#list .it.q b{color:var(--quiz)}
#list .it[aria-current=true]{border-color:var(--acc)}
#list .it i{margin-left:auto;font-style:normal;color:var(--ok);font-size:.82rem}
@media (max-width:600px){html{font-size:16px}#mode{padding:14px 16px}#mode .no{font-size:2rem}#mode .tt b{font-size:1.35rem}#who{display:none}}
</style>
</head>
<body>
<div id="banner" role="status"></div>

<div id="login">
 <div class="box">
  <h1>Claude 특강 <em>교재</em></h1>
  <p>팀을 고르고 이름을 쓰면 들어갑니다. 지난주와 같은 팀, 같은 이름으로 들어오면 기록이 이어집니다. 앞 화면이 실습으로 넘어가면 이 화면도 자동으로 바뀝니다.</p>
  <p id="roomNote" hidden>시험용 방입니다. 여기서 쓴 것은 실제 수업 기록과 섞이지 않습니다.</p>
  <span class="lab">팀</span>
  <div id="teamSel" role="group" aria-label="팀 고르기"></div>
  <label class="lab" for="nameIn">이름</label>
  <input id="nameIn" type="text" maxlength="12" autocomplete="off" placeholder="이름을 씁니다">
  <button id="enter" type="button">들어가기</button>
  <div id="loginMsg" role="status"></div>
  <span class="pill" id="pill0">연결 중</span>
  <details id="tmenu"><summary>강사 메뉴</summary>
   <div class="row" id="tGate"><input id="tPin" type="password" inputmode="numeric" placeholder="강사 코드" aria-label="강사 코드"><button id="tGo" type="button">확인</button><span id="tMsg"></span></div>
   <div id="tBody" hidden>
    <div class="row"><span>팀 수</span><button id="tMinus" type="button" aria-label="팀 줄이기">−</button><span id="tN">3</span><button id="tPlus" type="button" aria-label="팀 늘리기">+</button><span>최대 10팀</span></div>
    <div class="row"><span>기록을 지우는 버튼은 강의 화면의 "목차와 도구"에 있습니다.</span></div>
   </div>
  </details>
 </div>
</div>

<div id="app">
 <header id="bar"><div class="wrap">
  <span id="teamChip"></span><span id="roomChip" hidden>시험용 방</span>
  <input id="booth" data-k="booth" data-id="booth" type="text" maxlength="30" autocomplete="off" placeholder="부스 이름을 여기에 씁니다" aria-label="우리 팀 부스 이름">
  <span id="who"></span><span id="score">0점</span>
  <span class="pill" id="pill">연결 중</span>
  <button id="openList" type="button">실습 목록</button>
  <button id="leave" type="button">나가기</button>
 </div></header>
 <div class="wrap">
  <div id="mode"><span class="no" id="mNo"></span><div class="tt"><b id="mT"></b><span id="mS"></span></div><button id="followBtn" type="button" hidden>강의 따라가기</button><p id="pace" role="status" hidden></p></div>
  <main id="main"></main>
 </div>
</div>

<div id="list"><div class="sheet"><button id="closeList" type="button" style="float:right">닫기</button><h2>실습 목록</h2><div id="listBody"></div></div></div>

<div id="lb" role="dialog" aria-label="화면 사진 크게 보기"><img alt=""></div>

<div id="qgate" role="dialog" aria-modal="true" aria-labelledby="qgT"><div class="box">
 <h2 id="qgT">퀴즈 시간입니다</h2>
 <p id="qgS"></p>
 <button id="qgBtn" type="button">전체 화면으로 입장</button>
</div></div>

<script src="firebase-app-compat.js"></script>
<script src="firebase-database-compat.js"></script>
<script src="qr.js"></script>
<script src="steps.js"></script>
<script>
const DB_URL="https://claude-tg-e2e08-default-rtdb.asia-southeast1.firebasedatabase.app";
const CLASS_CODE="wyd-1119-k7q2";
const TEACHER_PIN="960105";
(()=>{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const setHTML=(el,h)=>{ if(el&&el._h!==h){el._h=h; el.innerHTML=h} };
const COLS=['members','answers','finals','results','checks','drafts','tprompts'];
const D={}; teamIds(TEAM_MAX).forEach(t=>{D[t]={}; COLS.forEach(c=>D[t][c]={})});
let CFG={teams:TEAM_DEFAULT,spare:'',short:''}, CLS={step:'',slide:'',qend:0,qz:false}, REVEAL={}, OFF=0;
/* 시험용 방: 주소 뒤에 ?room=test 를 붙이면 수업 기록과 섞이지 않는 따로 떨어진 자리에서 연다 */
const ROOM=(new URLSearchParams(location.search).get('room')||'').replace(/[^a-z0-9_-]/gi,'').slice(0,20), RK=k=>ROOM?k+'__'+ROOM:k;
let me=LS.get(RK('wb_me'),null), cur=STEPS[WEEK][0].id, follow=true, view='login', selTeam=me?me.team:null, teacher=LS.get('wb_teacher',false)===true;
let db=null, rdb=null, base='wb/'+CLASS_CODE+(ROOM?'/rooms/'+ROOM:''), mode='wait', isOn=false, everOn=false, saving=0, peers=[];
const nameKey=n=>'n'+[...n.trim()].map(c=>c.codePointAt(0).toString(36)).join('-');
const txt=v=>String((v&&v.text)||'').trim();
const T=()=>D[me.team];
const now=()=>Date.now()+OFF;                      /* 서버 시각에 맞춘 지금: 퀴즈 남은 시간에 쓴다 */
const appUrl=t=>new URL('app.html?t='+t+(ROOM?'&room='+ROOM:''),location.href).href;
/* 화면 사진: 사이트에 든 그림을 쓰고, 강사가 앞 화면에서 붙여 넣은 것이 있으면 그것을 쓴다 */
let SHOTX={};
const shotSrc=k=>{ const c=SHOTX[k]; if(c&&/^data:image\/(jpeg|png|webp);base64,/.test(String(c.d||''))) return c.d; const o=SHOTS[k]; return (o&&o.f)||'' };
const shotBtn=k=>k?`<button type="button" class="shot" data-shot="${k}" hidden><img alt="${esc((SHOTS[k]||{}).alt||'')}"><span>누르면 크게 보입니다</span></button>`:'';
function paintShots(){ $$('[data-shot]').forEach(b=>{ const u=shotSrc(b.dataset.shot), im=b.querySelector('img'); b.hidden=!u; if(u&&im.getAttribute('src')!==u) im.setAttribute('src',u) }) }
const qrSvg=u=>{ try{ const q=qrcode(0,'M'); q.addData(u); q.make(); return q.createSvgTag({cellSize:4,margin:0,scalable:true}) }catch(e){ return '' } };

/* ---------- 저장과 연결 ---------- */
const W={}, PEND={};
function setPill(){ const t=mode!=='db'?'연결 안 됨':!isOn?(everOn?'연결 끊김':'연결 중'):saving>0?'저장 중':'저장됨';
  ['#pill','#pill0'].forEach(s=>{const e=$(s); e.textContent=t; e.className='pill'+(mode==='db'&&isOn&&!saving?' db':'')}) }
function banner(m){const b=$('#banner'); b.textContent=m||''; b.classList.toggle('on',!!m)}
function send(path,data){ const w=W[path]||(W[path]={busy:false,next:null}); if(w.busy){w.next=data;return}
  w.busy=true; saving++; setPill();
  db.doc(path).set(data).then(()=>{ if(PEND[path]===data) delete PEND[path] },()=>banner('저장이 잠시 실패했습니다. 한 글자 더 입력하면 다시 저장합니다.'))
    .finally(()=>{w.busy=false; saving--; if(w.next){const d=w.next; w.next=null; send(path,d)} setPill()}) }
function put(col,id,data){ T()[col][id]=data; const p=`teams/${me.team}/${col}/${id}`; if(mode==='db'){PEND[p]=data; send(p,data)} refresh() }
function adapter(r,b){ const ref=p=>r.ref(b+'/'+p);
  const sub=(p,map)=>(next,err)=>{ref(p).on('value',s=>next(map(s)),e=>err&&err(e))};
  return { doc:p=>({set:d=>ref(p).set(d),remove:()=>ref(p).remove(),onDisconnectRemove:()=>ref(p).onDisconnect().remove(),onSnapshot:sub(p,s=>({exists:s.exists(),data:()=>s.val()}))}),
    collection:p=>({onSnapshot:sub(p,s=>{const v=s.val()||{}; return Object.keys(v).map(id=>[id,v[id]])})}) } }
const subbed={};
function subTeam(t,cols){ cols.forEach(col=>{ const k=t+'/'+col; if(subbed[k]||!db) return; subbed[k]=1;
  db.collection(`teams/${t}/${col}`).onSnapshot(rows=>{ const m={}; rows.forEach(([id,v])=>{m[id]=v});
    const pre=`teams/${t}/${col}/`; for(const p in PEND) if(p.startsWith(pre)) m[p.slice(pre.length)]=PEND[p];
    D[t][col]=m; if(view==='login') renderLogin(); else refresh() },()=>{}) }) }
function subAll(){ teamIds(CFG.teams).forEach(t=>subTeam(t,['members','answers','finals'])); if(me) subTeam(me.team,COLS) }
function connect(){
  if(!window.firebase||!firebase.initializeApp){ banner('공유 저장소에 연결하지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'); setPill(); return }
  try{
    firebase.initializeApp({databaseURL:DB_URL}); rdb=firebase.database(); db=adapter(rdb,base); mode='db';
    db.doc('class/config').onSnapshot(s=>{ const d=s.exists?(s.data()||{}):{}; const n=+d.teams; CFG.teams=Math.max(1,Math.min(TEAM_MAX,n||TEAM_DEFAULT)); CFG.spare=cleanDbUrl(d.spare); CFG.short=String(d.short||''); subAll(); renderLogin(); renderTeacher(); if(view==='app') refresh() },()=>{});
    db.doc('class/state').onSnapshot(s=>{ const d=s.exists?(s.data()||{}):{}; CLS={step:String(d.step||''),slide:String(d.slide||''),qend:+d.qend||0,qz:!!d.qz}; onState() },()=>{});
    db.collection('class/reveal').onSnapshot(rows=>{ REVEAL={}; rows.forEach(([id,v])=>{if(v)REVEAL[id]=true}); refresh() },()=>{});
    db.doc('class/epoch').onSnapshot(s=>{ const e=s.exists?String(s.data()):''; const KICK='강사가 기록을 초기화했습니다. 다시 들어와 주세요.';
      if(ep0===null){ ep0=e; const mine=LS.get(RK('wb_epoch'),''); LS.set(RK('wb_epoch'),e); if(me&&e&&mine!==e) kick(KICK) }
      else if(e!==ep0){ ep0=e; LS.set(RK('wb_epoch'),e); if(me) kick(KICK) } },()=>{});
    db.collection('presence').onSnapshot(rows=>{ peers=rows.map(r=>r[1]||{}) },()=>{});
    rdb.ref('.info/serverTimeOffset').on('value',s=>{ OFF=+s.val()||0 });
    rdb.ref('.info/connected').on('value',s=>{ isOn=s.val()===true; if(isOn){everOn=true; banner(''); if(me&&view==='app')present()} else if(everOn) banner('인터넷 연결이 끊겼습니다. 다시 연결되면 자동으로 저장합니다.'); setPill() });
    subAll();
    rdb.ref('wb/'+CLASS_CODE+'/shots').on('value',s=>{ SHOTX=s.val()||{}; paintShots() },()=>{});   /* 강사가 넣은 화면 사진: 다른 것을 먼저 받고 나서 받는다 */
  }catch(e){ mode='wait'; banner('공유 저장소에 연결하지 못했습니다. 새로고침해 주세요.') }
  setPill();
}
let presId=null, ep0=null;
function present(){ if(mode!=='db'||!me) return; const id=me.team+'_'+me.key; try{ presId=id; const d=db.doc('presence/'+id); d.onDisconnectRemove(); d.set({n:me.name,t:me.team,fs:fsIn()}) }catch(e){} }
function absent(){ if(mode==='db'&&presId){ try{db.doc('presence/'+presId).remove()}catch(e){} presId=null } }
function kick(msg){ if(entered) leaveQuiz(); me=null; LS.del(RK('wb_me')); view='login'; teamIds(TEAM_MAX).forEach(t=>COLS.forEach(c=>{D[t][c]={}})); for(const k in PEND) delete PEND[k];
  $('#app').classList.remove('on'); $('#login').style.display=''; $('#loginMsg').textContent=msg||''; built=''; gate(); renderLogin() }

/* ---------- 들어가기 ---------- */
function renderLogin(){ if(view!=='login') return;
  if(selTeam&&!teamIds(CFG.teams).includes(selTeam)) selTeam=null;
  setHTML($('#teamSel'),teamIds(CFG.teams).map(t=>`<button type="button" data-t="${t}" aria-pressed="${selTeam===t}">${teamLabel(t)}<small>${Object.keys(D[t].members).length}명</small></button>`).join('')) }
$('#teamSel').onclick=e=>{const b=e.target.closest('[data-t]'); if(!b)return; selTeam=b.dataset.t; $('#teamSel')._h=''; renderLogin()};
let nameAsk='';
function enter(){ let name=$('#nameIn').value.trim().replace(/\s+/g,' ');
  if(!selTeam){$('#loginMsg').textContent='팀을 먼저 골라 주세요.';return} if(!name){$('#loginMsg').textContent='이름을 써 주세요.';return}
  /* 지난주 이름과 띄어쓰기만 다르면 지난주 이름으로 맞춘다. 처음 보는 이름이면 한 번 더 확인한다(이름 목록은 보여 주지 않는다). */
  const mem=Object.values(D[selTeam].members||{}).filter(m=>m&&m.name), sq=v=>String(v).replace(/\s+/g,'').toLowerCase();
  const hit=mem.find(m=>sq(m.name)===sq(name));
  if(hit) name=hit.name;
  else if(mem.some(m=>(+m.at||0)<WEEK2_FROM)&&nameAsk!==selTeam+'|'+name){ nameAsk=selTeam+'|'+name; $('#loginMsg').textContent='지난주 이 팀에 없던 이름입니다. 지난주와 같은 이름이어야 점수가 이어집니다. 맞으면 한 번 더 누릅니다.'; return }
  nameAsk=''; me={team:selTeam,name,key:nameKey(name)}; LS.set(RK('wb_me'),me); start() }
function start(){ view='app'; $('#login').style.display='none'; $('#app').classList.add('on'); $('#loginMsg').textContent='';
  subTeam(me.team,COLS); const m0=T().members[me.key]; put('members',me.key,{name:me.name,at:(m0&&m0.at)||Date.now()}); present(); follow=true; onState(true) }
$('#enter').onclick=enter; $('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
$('#leave').onclick=()=>{ flushAll(); if(entered) leaveQuiz(); absent(); me=null; LS.del(RK('wb_me')); view='login'; built=''; $('#app').classList.remove('on'); $('#login').style.display=''; gate(); renderLogin() };

/* ---------- 강사 메뉴 ---------- */
function renderTeacher(){ $('#tGate').hidden=teacher; $('#tBody').hidden=!teacher; $('#tN').textContent=CFG.teams+'팀' }
$('#tGo').onclick=()=>{ if($('#tPin').value.trim()===TEACHER_PIN){teacher=true; LS.set('wb_teacher',true); renderTeacher()} else $('#tMsg').textContent='코드가 다릅니다.' };
const setTeams=n=>{ n=Math.max(1,Math.min(TEAM_MAX,n)); if(mode==='db') db.doc('class/config').set({teams:n,spare:CFG.spare||'',short:CFG.short||''}) };
$('#tMinus').onclick=()=>setTeams(CFG.teams-1); $('#tPlus').onclick=()=>setTeams(CFG.teams+1);

/* ---------- 퀴즈: 전체 화면으로 들어오고, 푸는 동안 화면을 벗어나면 그 문제는 무효 ---------- */
let entered=false, fsDenied=false;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
const fsCan=()=>{ const e=document.documentElement; return !!(e.requestFullscreen||e.webkitRequestFullscreen) };
function fsIn(){ return entered&&(!!fsEl()||!fsCan()||fsDenied) }
const quizMode=()=>view==='app'&&!!me&&!!CLS.qz;
const qStep=()=>{ const s=stepById(CLS.step); return s&&s.kind==='quiz'?s:null };
const qActive=()=>{ const s=qStep(); return !!s&&quizMode()&&!REVEAL[s.id]&&CLS.qend>now() };
/* 전체 화면 요청에 답이 없는 브라우저가 있다(다른 앱 안에서 연 브라우저 등). 그런 곳에서 입장 화면에 갇히지 않게,
   잠깐 기다려도 전체 화면이 되지 않으면 그대로 입장시킨다. 창이나 탭을 벗어나면 무효가 되는 것은 그대로다. */
const within=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
async function enterQuiz(){ entered=true; const el=document.documentElement;
  try{ if(el.requestFullscreen) await within(el.requestFullscreen({navigationUI:'hide'}),1500); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); else fsDenied=true }catch(e){ fsDenied=true }
  for(let i=0;i<8&&!fsDenied&&!fsEl();i++) await new Promise(r=>setTimeout(r,150));
  if(!fsEl()) fsDenied=true;
  try{ if(navigator.keyboard&&navigator.keyboard.lock) await within(navigator.keyboard.lock(),600) }catch(e){}
  present(); gate(); refresh() }
function leaveQuiz(){ entered=false; fsDenied=false;
  try{ if(navigator.keyboard&&navigator.keyboard.unlock) navigator.keyboard.unlock() }catch(e){}
  try{ if(fsEl()){ const x=document.exitFullscreen||document.webkitExitFullscreen; const p=x.call(document); if(p&&p.catch) p.catch(()=>{}) } }catch(e){}
  present() }
function gate(){ const on=quizMode()&&!fsIn(); $('#qgate').classList.toggle('on',on); if(!on) return; const act=qActive();
  $('#qgT').textContent=act?'문제가 시작되었습니다':'퀴즈 시간입니다';
  $('#qgS').textContent=act?'입장해야 답을 고를 수 있습니다. 시간은 계속 흐릅니다.':'버튼을 누르면 전체 화면이 됩니다. 문제를 푸는 동안 다른 창이나 탭으로 가면 그 문제는 무효가 됩니다.' }
function voidNow(why){ if(!me||!entered||!qActive()) return; const s=qStep(), id=s.id+'__'+me.key, a=T().answers[id]; if(a&&a.left) return;
  put('answers',id,{s:s.id,name:me.name,opt:-1,text:'',left:true,why,at:Date.now()}) }
const onFs=()=>{ if(!fsEl()&&entered&&!fsDenied) voidNow('fs'); present(); gate(); refresh() };
document.addEventListener('fullscreenchange',onFs); document.addEventListener('webkitfullscreenchange',onFs);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) voidNow('hidden') });
addEventListener('blur',()=>voidNow('blur'));
$('#qgBtn').onclick=enterQuiz;

/* ---------- 지금 화면 정하기 ----------
   교재는 앞 화면을 따라간다. 앞 화면이 실습 장면이면 그 단계를 열고, 설명 장면이면 "앞 화면을 봐 주세요"를 띄운다.
   앞 화면이 넘어가면 덜 끝낸 팀도 함께 넘어간다. "실습 목록"에서 지난 단계를 열어 둔 사람도 그때 다시 따라온다. */
const watching=()=>follow&&!!CLS.slide&&!CLS.step;
let seenAt='';                                                  /* 마지막으로 따라간 앞 화면의 자리(단계와 장면) */
function onState(force){ if(view!=='app') return;
  const at=CLS.step+'\n'+CLS.slide, moved=at!==seenAt; seenAt=at;
  if(CLS.qz||moved) follow=true;                                 /* 앞 화면이 넘어가면, 그리고 퀴즈 시간에는 모두 앞 화면을 따라온다 */
  if(!CLS.qz&&entered) leaveQuiz();
  if(moved){ $('#list').classList.remove('on'); $('#lb').classList.remove('on') }   /* 열어 둔 목록과 크게 본 사진은 닫는다 */
  if(follow&&CLS.step&&stepById(CLS.step)) cur=CLS.step; build(force); gate() }
$('#followBtn').onclick=()=>{ follow=true; onState(true) };
function openStep(id){ follow=(id===CLS.step); cur=id; $('#list').classList.remove('on'); build(true) }

/* ---------- 입력 저장 ---------- */
const typing={}, typingFn={};
function debounce(key,fn){ clearTimeout(typing[key]); typingFn[key]=fn; typing[key]=setTimeout(()=>{delete typing[key]; delete typingFn[key]; fn()},600) }
function flushAll(){ for(const k in typing){ clearTimeout(typing[k]); const f=typingFn[k]; delete typing[k]; delete typingFn[k]; try{f&&f()}catch(e){} } }
function grow(el){ if(!el||el.tagName!=='TEXTAREA'||!el.offsetParent) return; el.style.height='auto'; el.style.height=Math.min(el.scrollHeight+2,520)+'px' }
function save(el){ const k=el.dataset.k, id=el.dataset.id, v=el.value, now=Date.now();
  if(k==='ans') put('answers',id+'__'+me.key,{s:id,name:me.name,text:v,at:now});
  else if(k==='dr') put('drafts',id+'__'+me.key,{t:id,name:me.name,text:v,at:now});
  else if(k==='tp') put('tprompts',id,{text:v,by:me.name,at:now});
  else if(k==='res') put('results',id,{text:v,by:me.name,at:now});
  else if(k==='fin') put('finals',id,{text:v.trim(),by:me.name,at:now});
  else if(k==='dburl') put('finals','dburl',{text:cleanDbUrl(v),by:me.name,at:now});
  else if(k==='booth') put('finals','booth',{text:v,by:me.name,at:now}) }
document.addEventListener('input',e=>{ const el=e.target; if(!el.dataset||!el.dataset.k||!me) return; grow(el); debounce(el.id,()=>save(el));
  if(el.dataset.k==='tp'){ const s=stepById(cur); s&&s.blocks.forEach((x,i)=>{ if(x.b==='prompt'&&x.tid===el.dataset.id) markParts(x,i) }) } });
document.addEventListener('focusout',e=>{ const el=e.target; if(el.dataset&&el.dataset.k&&typing[el.id]){ clearTimeout(typing[el.id]); delete typing[el.id]; delete typingFn[el.id]; save(el) } });
function setVal(el,v){ if(!el||document.activeElement===el||typing[el.id]) return; if(el.value!==v){ el.value=v; grow(el) } }
function copyText(t,btn){ const done=ok=>{ const o=btn.dataset.o||btn.textContent; btn.dataset.o=o; btn.textContent=ok?'복사했습니다':'복사하지 못했습니다'; setTimeout(()=>{btn.textContent=o},1500) };
  try{ navigator.clipboard.writeText(t).then(()=>done(true),()=>done(false)) }catch(e){ done(false) } }

/* ---------- 2주차: 저장소 주소 확인 ---------- */
let probeN=0, PROBE={url:'',state:'',msg:''};
async function probe(url){ PROBE={url,state:'run',msg:'확인하는 중입니다'}; refresh(); let app=null;
  const done=(state,msg)=>{ PROBE={url,state,msg}; if(state==='ok') put('finals','dbok',{text:url,by:me.name,at:Date.now()}); else refresh(); try{ app&&app.delete&&app.delete() }catch(e){} };
  try{ app=firebase.initializeApp({databaseURL:url},'probe'+(++probeN)); const r=app.database().ref('_class_check'), stamp=Date.now();
    const to=()=>new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000));
    await Promise.race([r.set({at:stamp}),to()]); const s=await Promise.race([r.once('value'),to()]); const v=s.val();
    if(v&&v.at===stamp){ try{ await Promise.race([r.remove(),to()]) }catch(e){} done('ok','연결되었습니다. 이 주소로 읽고 쓸 수 있습니다.') }
    else done('bad','쓴 값을 다시 읽지 못했습니다. 주소를 다시 확인해 주세요.');
  }catch(e){ const m=String((e&&(e.code||e.message))||'');
    done('bad',/permission/i.test(m)?'주소는 맞지만 쓸 수 없습니다. 보안 규칙이 테스트 모드인지 확인해 주세요.':'연결하지 못했습니다. 주소가 정확한지, 데이터베이스를 만들었는지 확인해 주세요.') } }
const dbState=()=>{ const u=txt(T().finals.dburl); if(!u) return {u,cls:'',msg:''}; if(!DBURL_RE.test(u)) return {u,cls:'bad',msg:'주소 모양이 다릅니다. https:// 로 시작하고 firebasedatabase.app 또는 firebaseio.com 으로 끝나야 합니다.'};
  if(PROBE.url===u&&PROBE.state) return {u,cls:PROBE.state,msg:PROBE.msg}; if(txt(T().finals.dbok)===u) return {u,cls:'ok',msg:'연결을 확인한 주소입니다.'}; return {u,cls:'',msg:'"연결 확인"을 눌러 주세요.'} };

/* ---------- 2주차: 프로그램 올리기 ---------- */
let CODEMSG='';
function cleanCode(v){ v=String(v||'').replace(/^﻿/,'').trim(); const m=v.match(/^```[a-zA-Z]*\s*\n([\s\S]*?)\n```\s*$/); return m?m[1].trim():v }
function codeWarn(v){ const w=[], u=txt(T().finals.dburl);
  if(!/<\/html\s*>/i.test(v)) w.push('코드 끝에 </html>이 없습니다. 끝까지 복사되지 않았을 수 있습니다.');
  if(!/firebase/i.test(v)) w.push('Firebase에 연결하는 부분이 보이지 않습니다. 다른 기기와 연동되지 않을 수 있습니다.');
  else if(u&&v.indexOf(u.replace(/^https:\/\//,''))<0) w.push('코드에 우리 팀 데이터베이스 주소가 없습니다. 프롬프트에 주소를 넣었는지 확인해 주세요.');
  return w }
async function uploadCode(raw,btn){ const v=cleanCode(raw);

  if(v.length>600000){ CODEMSG='코드가 너무 큽니다(60만 자 이상). 사진 같은 큰 자료는 빼 달라고 Claude에게 부탁해 주세요.'; refresh(); return }
  if(mode!=='db'){ CODEMSG='지금은 연결되어 있지 않아 올릴 수 없습니다.'; refresh(); return }
  const n=((T().finals.app&&+T().finals.app.n)||0)+1, at=Date.now(); if(btn) btn.disabled=true; CODEMSG='올리는 중입니다'; refresh();
  try{ await rdb.ref(base+'/apps/'+me.team).set({html:v,by:me.name,at,n}); put('finals','app',{text:n+'번째 올림',n,size:v.length,by:me.name,at});
    const w=codeWarn(v); CODEMSG='올렸습니다. 열려 있는 기기는 몇 초 안에 새 것으로 바뀝니다.'+(w.length?'\n확인해 주세요: '+w.join(' '):''); $$('.codein').forEach(t=>{t.value=''}) }
  catch(e){ CODEMSG='올리지 못했습니다. 잠시 뒤에 다시 눌러 주세요.' }
  if(btn) btn.disabled=false; refresh() }

function stepHtml(s){
  let h=s.goal?`<p class="goal">${esc(s.goal)}</p>`:'';
  if(s.show) h+=`<div class="showbox">${s.show.map(x=>`<div><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join('')}</div>`;
  if(s.kind==='wall') h+=(s.apps?`<div id="appsBox"></div>`:'')+`<p class="qq">${esc(s.q)}</p>`+wbox(1,'내 답','나만 씁니다 · 앞 화면에 나타납니다',`<textarea id="ans_${s.id}" data-k="ans" data-id="${s.id}" rows="2" placeholder="${esc(s.ph||'')}"></textarea>`);
  else if(s.kind==='tap') h+=`<button type="button" class="tapbig" id="tapBtn">누르기</button><p id="tapN" role="status"></p>`;
  else if(s.kind==='kit') h+=kitHtml(s);
  else if(s.kind==='check') h+=`<div class="checks" id="cks">${s.checks.map((c,i)=>`<button type="button" data-ck="${i}" aria-pressed="false">${esc(c)}</button>`).join('')}</div><p class="hint">팀이 함께 쓰는 목록입니다. 한 사람이 누르면 팀 전체에 표시됩니다.</p>`;
  else if(s.kind==='solo') h+=`<div class="guide"><p>${esc(s.how)}</p><div class="cols"><div><h4>좋은 프롬프트를 쓰려면</h4><ul>${s.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></div>
    <p class="exnote">아래 문장은 예시입니다. 내가 원하는 내용으로 고쳐서 써도 됩니다.</p>
    <div class="missions" id="cks">${s.moves.map((m,i)=>`<div class="ms"><div class="mh"><b>${i+1}</b><strong>${esc(m.t)}</strong></div>${m.say?`<small>예시</small><div class="say"><span>${esc(m.say)}</span><button type="button" data-say="${i}">복사</button></div>`:`<p>${esc(m.note||'')}</p>`}<button type="button" class="done" data-sk="${i}" aria-pressed="false">해 봤습니다</button></div>`).join('')}</div>`;
  else if(s.kind==='poll'||s.kind==='quiz') h+=`<div id="qvoid"></div><p class="qq">${esc(s.q)}</p>${s.quote?`<div class="quote">${esc(s.quote)}</div>`:''}<div class="opts" id="opts">${s.opts.map((o,i)=>`<button type="button" data-opt="${i}"><b>${'ABCD'[i]||i+1}</b><span>${esc(o)}</span></button>`).join('')}</div><p id="qmsg" role="status"></p>`;
  else { const multi=s.tasks.length>1; if(multi) h+=`<p class="hint" style="margin:0 0 12px">맡은 파트를 눌러 엽니다.</p>`;
    h+=s.tasks.map(t=>taskHtml(s,t,multi)).join('');
    if(s.copyAll) h=h.replace('<section class="write">',`<p><button type="button" id="copyAll">우리 팀 결과 모두 복사</button></p><section class="write">`) }
  return h;
}

  const ab=appBox(), has=!!T().finals.app; $$('[data-appv]').forEach(el=>{ el.classList.toggle('none',!has); setHTML(el,ab) });
  $$('[data-cmsg]').forEach(el=>{ if(el.textContent!==CODEMSG) el.textContent=CODEMSG });
  if($('[data-bparts]')){ const b=bundle(); $$('[data-bparts]').forEach(el=>setHTML(el,b.have.map(h=>`<span class="${h[1]?'y':''}">${h[0]} ${h[1]?'있음':'없음'}</span>`).join(''))); $$('[data-btext]').forEach(el=>{ if(el.textContent!==b.text) el.textContent=b.text }) } }
function refresh(){ if(view!=='app'||!me) return; setPill();
  $('#teamChip').textContent=teamLabel(me.team); $('#who').textContent=me.name; setVal($('#booth'),txt(T().finals.booth));

  $('#mS').textContent=s.kind==='quiz'?`퀴즈 · ${s.pt}점`:`${KIND[s.kind]} · ${s.w==='w1'?'1주차':'2주차'}`;
  { const fs=(CLS.step&&stepById(CLS.step))||null, behind=!follow&&!!CLS.slide&&CLS.step!==cur&&!CLS.qz, fb=$('#followBtn'), pc=$('#pace'); fb.hidden=!behind; pc.hidden=!behind;

  if(s.kind==='wall'){ setVal($('#ans_'+s.id),txt(T().answers[s.id+'__'+me.key])); if(s.apps) setHTML($('#appsBox'),appList()) }
  else if(s.kind==='tap'){ const a=T().answers[s.id+'__'+me.key]; $('#tapN').textContent='내가 누른 횟수 '+((a&&+a.n)||0) }
  else if(s.kind==='kit') refreshKit(s);
  else if(s.kind==='solo'){ const a=T().answers[s.id+'__'+me.key], it=(a&&a.items)||{}; $$('#cks [data-sk]').forEach(b=>{ b.setAttribute('aria-pressed',!!it[b.dataset.sk]); b.closest('.ms').classList.toggle('ok',!!it[b.dataset.sk]) }) }
  else if(s.kind==='check'){ const it=(T().checks[s.id]&&T().checks[s.id].items)||{}; $$('#cks [data-ck]').forEach(b=>b.setAttribute('aria-pressed',!!it[b.dataset.ck])) }
  else if(s.kind==='poll'||s.kind==='quiz'){ const a=T().answers[s.id+'__'+me.key], pick=a&&a.opt>=0?a.opt:-1, rev=s.kind==='quiz'&&REVEAL[s.id], msg=$('#qmsg'), left=!!(a&&a.left);
    $$('#opts button').forEach(b=>{ const i=+b.dataset.opt; b.className=rev?(i===s.ans?'ok':i===pick?'no':''):(i===pick?'sel':''); b.disabled=!!rev||left });

    msg.className='';
    if(s.kind==='poll') msg.textContent=pick>=0?'고른 답은 앞 화면에 모입니다. 바꿀 수 있습니다.':'';
    else if(!rev){ const sec=CLS.qend?Math.max(0,Math.ceil((CLS.qend-now())/1000)):0; msg.textContent=left?'':(sec?`남은 시간 ${sec}초 · `:'')+(pick>=0?'답을 보냈습니다. 정답이 공개되기 전까지 바꿀 수 있습니다.':'하나를 고릅니다.') }
    else if(left){ msg.className='no'; msg.textContent=`정답은 ${'ABCD'[s.ans]}입니다. `+s.why }
    else { const ok=pick===s.ans; msg.className=ok?'ok':'no'; msg.textContent=(ok?`정답입니다. +${s.pt}점. `:pick>=0?`아쉽습니다. 정답은 ${'ABCD'[s.ans]}입니다. `:`답을 고르지 않았습니다. 정답은 ${'ABCD'[s.ans]}입니다. `)+s.why } }
  else s.tasks.forEach(t=>{

const sampleHtml=()=>`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시험용 대기 번호</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17181B;color:#E7E4DC;font-family:sans-serif;text-align:center}b{display:block;font-size:30vw;line-height:1;color:#F08A5D}button{font-size:1.5rem;padding:.6em 1.3em;margin:.3em;border-radius:14px;border:0}#s{color:#A9A59C}</style></head><body><div><p>시험용 대기 번호 · ${teamLabel(me.team)}</p><b id="n">0</b><button id="p">다음 번호</button><button id="r">처음으로</button><p id="s">연결 중</p></div><script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"><\/script><script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"><\/script><script>firebase.initializeApp({databaseURL:"${DB_URL}"});var r=firebase.database().ref("${base}/demo/${me.team}");r.on("value",function(s){document.getElementById("n").textContent=s.val()||0});document.getElementById("p").onclick=function(){r.transaction(function(v){return (v||0)+1})};document.getElementById("r").onclick=function(){r.set(0)};firebase.database().ref(".info/connected").on("value",function(s){document.getElementById("s").textContent=s.val()?"연결됨":"연결 안 됨"})<\/script></body></html>`;
document.addEventListener('click',e=>{ if(view!=='app'||!me) return; const s=stepById(cur); let b;
  if((b=e.target.closest('[data-shot]'))){ const u=shotSrc(b.dataset.shot); if(u){ const im=$('#lb img'); im.src=u; im.alt=b.querySelector('img').alt; $('#lb').classList.add('on') } return }

    if(!new RegExp(q.re).test(el.value)){ el.value=(el.value.trim()?el.value.replace(/\s+$/,'')+'\n':'')+q.stem; grow(el); put('tprompts',x.tid,{text:el.value,by:me.name,at:Date.now()}) }

    const i=+b.dataset.opt, d={s:s.id,name:me.name,opt:i,text:s.opts[i],at:Date.now()};
    if(s.kind==='quiz'&&CLS.qend){ const sec=(s.sec||20)*1000; d.ms=Math.max(0,Math.min(sec,Math.round(now()-(CLS.qend-sec)))) }
    put('answers',id,d) }
  else if(e.target.id==='tapBtn'){ const id=s.id+'__'+me.key, a=T().answers[id]; put('answers',id,{s:s.id,name:me.name,n:((a&&+a.n)||0)+1,at:Date.now()}) }
  else if((b=e.target.closest('[data-ck]'))){ const c=T().checks[s.id]||{items:{}}; const items=Object.assign({},c.items); items[b.dataset.ck]=!items[b.dataset.ck]; put('checks',s.id,{items,by:me.name,at:Date.now()}) }
  else if((b=e.target.closest('[data-say]'))) copyText(s.moves[+b.dataset.say].say,b);
  else if((b=e.target.closest('[data-saycp]'))) copyText($(`[data-sayt="${b.dataset.saycp}"]`).textContent,b);
  else if((b=e.target.closest('[data-copyref]'))) copyText(s.blocks[+b.dataset.copyref].text(ctx()),b);
  else if((b=e.target.closest('[data-copybundle]'))) copyText(bundle().text,b);
  else if((b=e.target.closest('[data-planfile]'))){ const tx='# '+teamLabel(me.team)+' 부스 기획안\n\n'+bundle().text+'\n', u=URL.createObjectURL(new Blob([tx],{type:'text/markdown;charset=utf-8'})), l=document.createElement('a');
    l.href=u; l.download='booth-plan.md'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); const o=b.textContent; b.textContent='받았습니다'; setTimeout(()=>{b.textContent=o},1500) }
  else if((b=e.target.closest('[data-copyurl]'))) copyText(appUrl(me.team),b);
  else if((b=e.target.closest('[data-copycode]'))){ const btn=b; if(mode==='db') rdb.ref(base+'/apps/'+me.team).once('value').then(v=>copyText(String(((v.val()||{}).html)||''),btn),()=>copyText('',btn)) }
  else if((b=e.target.closest('[data-upload]'))) uploadCode($('#'+b.dataset.upload).value,b);
