<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부스 워크북</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: working tool. fixed header, step rail on the left, one step at a time on the right.
     same world as the lecture deck: black, bone white, vermilion for action, yellow for live/shared state. single theme by choice. */
  --ink:#0B0B0C; --ink2:#151517; --ink3:#1D1D20; --line:#2E2E33; --paper:#F3F0EA; --dim:#A6A198;
  --hot:#FF4A1C; --flash:#FFE500; --ok:#58D68D;
  --f-d:"Anton","Black Han Sans","Noto Sans KR",Impact,sans-serif;
  --f-ko:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-m:"IBM Plex Mono","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-b);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);padding:.45em .9em;border-radius:0;white-space:nowrap}
button:hover{border-color:var(--paper)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--flash);outline-offset:2px}
textarea,input[type=text],select{width:100%;background:var(--ink);border:1px solid var(--line);padding:.55em .7em;border-radius:0;line-height:1.55}
textarea{resize:vertical;min-height:2.8em;display:block}
textarea:focus,input[type=text]:focus{border-color:var(--paper);outline:none}
p,li{text-wrap:pretty}
h1,h2,h3{text-wrap:balance;font-weight:400}
.hotb{background:var(--hot);border-color:var(--hot);color:var(--ink);font-family:var(--f-ko)}
.hotb:hover{background:var(--flash);border-color:var(--flash)}
.cap{font-family:var(--f-m);font-size:.74rem;color:var(--dim);letter-spacing:.03em;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.cap i{font-style:normal;color:var(--flash)}
mark{background:none;color:var(--flash)}

/* login */
#login{min-height:100%;display:grid;align-content:center;gap:22px;padding:clamp(18px,5vw,64px);max-width:1100px;margin:0 auto}
#login h1{font-family:var(--f-d);font-size:clamp(54px,11vw,150px);line-height:.9}
#login h1 em{font-style:normal;color:var(--hot);font-family:var(--f-ko)}
#login .lede{color:var(--dim);max-width:60ch}
.teams{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.teams button{text-align:left;padding:16px;display:grid;gap:4px;white-space:normal;background:var(--ink2);align-content:start;min-height:120px}
.teams button b{font-family:var(--f-d);font-weight:400;font-size:2.4rem;line-height:1}
.teams button span{font-family:var(--f-ko);font-size:1.1rem;color:var(--hot)}
.teams button small{color:var(--dim);font-size:.82rem}
.teams button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.teams button[aria-pressed="true"] small{color:#444}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row .f{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:.9rem;padding:.35em .8em}
.chips button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
#loginMsg{color:var(--flash);min-height:1.6em;font-size:.9rem}

/* app shell */
#app{height:100%;display:none;grid-template-rows:auto auto 1fr}
#app.on{display:grid}
#hd{display:flex;align-items:center;gap:10px 14px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#hd .brand{font-family:var(--f-ko);font-size:1.15rem;white-space:nowrap}
#hd .brand b{font-family:var(--f-d);font-weight:400;color:var(--hot);font-size:1.3rem;margin-right:.3em}
#hd .who{font-size:.86rem;color:var(--dim);margin-right:auto;min-width:0}
#hd .who b{color:var(--paper);font-weight:500}
.pill{font-family:var(--f-m);font-size:.74rem;padding:.2em .7em;border:1px solid var(--line);white-space:nowrap}
.pill.db{border-color:var(--ok);color:var(--ok)}.pill.local{border-color:var(--flash);color:var(--flash)}
.pill.saving{border-color:var(--paper);color:var(--paper)}
#hd button{font-size:.82rem;padding:.3em .7em}
#now{display:none;align-items:center;gap:10px;padding:6px 16px;background:var(--hot);color:var(--ink);font-family:var(--f-ko);flex-wrap:wrap}
#now.on{display:flex}
#now output{font-family:var(--f-d);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
#now button{border-color:var(--ink);font-size:.8rem;padding:.2em .7em;font-family:var(--f-b)}
#banner{display:none;padding:8px 16px;border-bottom:1px dashed var(--flash);color:var(--flash);font-size:.88rem}
#banner.on{display:block}
#body{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0}
#rail{border-right:1px solid var(--line);overflow-y:auto;padding:12px}
.seg{display:flex;margin-bottom:10px}
.seg button{flex:1;border-right-width:0;font-size:.88rem}
.seg button:last-child{border-right-width:1px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
#steps{display:grid;gap:6px}
#steps button{text-align:left;display:grid;grid-template-columns:auto 1fr;gap:0 10px;white-space:normal;padding:.55em .7em;align-items:baseline}
#steps button b{font-family:var(--f-d);font-weight:400;font-size:1.25rem;color:var(--hot);grid-row:span 2}
#steps button span{font-family:var(--f-ko);font-size:1.02rem;line-height:1.25}
#steps button span i{font-style:normal}
#steps button small{font-family:var(--f-m);font-size:.7rem;color:var(--dim)}
#steps button small i{font-style:normal;color:var(--ok)}
#steps button[aria-current="true"]{background:var(--ink3);border-color:var(--hot)}
#steps button.live{box-shadow:inset 4px 0 0 var(--flash)}
#rail .mem{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px;font-size:.86rem}
#rail .mem div{display:flex;gap:8px;align-items:baseline}
#rail .mem .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;align-self:center}
#rail .mem .dot.on{background:var(--ok)}
#rail .mem small{color:var(--dim);margin-left:auto;font-size:.76rem;white-space:nowrap}
#main{min-height:0;overflow-y:auto;padding:clamp(16px,2.6vw,36px);scroll-behavior:smooth}
.stephead{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.stephead .k{font-family:var(--f-d);font-size:clamp(40px,5vw,72px);line-height:.9;color:transparent;-webkit-text-stroke:2px var(--hot)}
.stephead h2{font-family:var(--f-ko);font-size:clamp(28px,3.6vw,52px);line-height:1.05}
.stephead .t{font-family:var(--f-m);font-size:.8rem;color:var(--dim);margin-left:auto;white-space:nowrap}
.goal{color:var(--dim);max-width:70ch;margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px;font-family:var(--f-m);font-size:.76rem;color:var(--dim)}
.flow span{border:1px solid var(--line);padding:.15em .7em}
.flow span b{color:var(--hot);font-weight:500;margin-right:.4em}
.grp{margin-bottom:30px}
.grp>h3{font-family:var(--f-ko);font-size:1.5rem;line-height:1.2;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grp>h3 .role{font-family:var(--f-m);font-size:.74rem;background:var(--hot);color:var(--ink);padding:.15em .6em}
.sec{font-family:var(--f-m);font-size:.76rem;color:var(--hot);letter-spacing:.06em;margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.q{border:1px solid var(--line);background:var(--ink2);padding:14px;margin-bottom:10px;display:grid;gap:10px}
.q .ql{font-family:var(--f-ko);font-size:1.15rem;line-height:1.3;display:block}
.q .hint{color:var(--dim);font-size:.86rem;margin-top:2px}
.qcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.others{display:grid;gap:6px;align-content:start}
.others .none{color:var(--dim);font-size:.86rem;border:1px dashed var(--line);padding:.55em .7em}
.ans{display:grid;gap:2px;text-align:left;white-space:normal;padding:.45em .7em;background:var(--ink);width:100%}
.ans b{font-family:var(--f-m);font-weight:500;font-size:.74rem;color:var(--flash)}
.ans span{font-size:.92rem;white-space:pre-wrap}
.ans:hover{border-color:var(--flash)}
.ans.mine b{color:var(--hot)}
.fin{border-top:1px dashed var(--line);padding-top:10px}
.fin textarea{border-color:var(--flash)}
.pc{border:1px solid var(--line);background:#101011;margin-bottom:10px}
.pc header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pc header b{font-family:var(--f-m);font-weight:500;font-size:.74rem;background:var(--hot);color:var(--ink);padding:.1em .55em;white-space:nowrap}
.pc header span{font-size:.92rem;margin-right:auto}
.pc header button{font-size:.8rem;padding:.25em .8em}
.pc header button.ok{background:var(--flash);color:var(--ink);border-color:var(--flash)}
.pc pre{font-family:var(--f-b);font-size:.9rem;line-height:1.7;white-space:pre-wrap;padding:14px;margin:0;max-height:340px;overflow-y:auto}
.pc .warn{padding:6px 12px;border-top:1px dashed var(--flash);color:var(--flash);font-size:.8rem;display:none}
.pc.miss .warn{display:block}
.res{border:1px solid var(--ok);background:var(--ink2);padding:14px;margin-bottom:10px}
.res label{font-family:var(--f-ko);font-size:1.15rem;display:block;margin-bottom:6px}
.res textarea{min-height:7em}
.chk{display:grid;gap:6px}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{accent-color:var(--hot);width:1.1em;height:1.1em;margin-top:.3em;flex:none}
.skill{border-left:4px solid var(--flash);background:var(--ink2);padding:10px 14px;margin:10px 0;display:grid;gap:2px;max-width:80ch}
.skill b{font-family:var(--f-m);font-weight:400;font-size:.74rem;color:var(--flash);letter-spacing:.04em}
.skill span{font-family:var(--f-ko);font-size:1.25rem;line-height:1.2}
.skill p{color:var(--dim);font-size:.92rem}
.rolebox{border:1px solid var(--line);padding:14px;margin-bottom:22px;background:var(--ink2)}
.rolegrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-top:10px}
.rolegrid button{display:grid;gap:3px;text-align:left;white-space:normal;padding:.6em .8em;background:var(--ink);align-content:start}
.rolegrid button b{font-family:var(--f-ko);font-weight:400;font-size:1.15rem}
.rolegrid button span{font-size:.84rem;color:var(--dim)}
.rolegrid button small{font-family:var(--f-m);font-size:.74rem;color:var(--flash)}
.rolegrid button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.rolegrid button[aria-pressed="true"] span{color:#444}.rolegrid button[aria-pressed="true"] small{color:#8a2a10}
.jump{margin:0 0 18px}
.task{border:1px solid var(--hot);background:var(--ink2);padding:14px;margin-bottom:10px;display:grid;gap:12px}
.brief{display:grid;gap:6px;justify-items:start}
.brief b{font-family:var(--f-m);font-weight:500;font-size:.74rem;background:var(--hot);color:var(--ink);padding:.1em .55em}
.brief p{font-size:1.02rem;max-width:75ch}
.brief button{font-size:.82rem;padding:.25em .8em}
.hints{padding-left:1.2em;color:var(--flash);font-size:.9rem;display:grid;gap:2px}
.hints[hidden]{display:none}
.elrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.elems button{font-size:.8rem;padding:.2em .7em}
.refwrap{border-top:1px dashed var(--line);padding-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.refbox{flex-basis:100%;display:grid;gap:8px;margin-top:6px}
.refbox[hidden]{display:none}
.fu{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
div.ans{border:1px solid var(--line)}
textarea.flash{animation:fl .9s}
@keyframes fl{from{background:var(--flash);color:var(--ink)}to{background:var(--ink)}}
.showbox{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));margin:6px 0 18px}
.showbox .pc{margin:0}
.choice button{font-family:var(--f-ko);font-size:1.2rem;padding:.45em 1.1em}
#now.watch{background:var(--ink2);color:var(--flash);border-bottom:1px solid var(--flash);font-family:var(--f-b)}
#now.watch button{border-color:var(--flash)}
.nextrow{display:flex;gap:10px;justify-content:space-between;margin:26px 0 40px;flex-wrap:wrap}

/* overview */
#over{display:none;height:100%;overflow-y:auto;padding:clamp(16px,3vw,40px)}
#over.on{display:block}
#over h1{font-family:var(--f-d);font-size:clamp(40px,6vw,84px);line-height:.95;margin-bottom:6px}
#over h1 em{font-style:normal;color:var(--hot);font-family:var(--f-ko)}
.ctl{border:1px solid var(--hot);padding:14px;margin:14px 0 20px;display:grid;gap:10px}
.ctl .row{align-items:center}
.ctl select{width:auto;min-width:16em}
.ogrid{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.ot{border:1px solid var(--line);background:var(--ink2);padding:16px;display:grid;gap:10px;align-content:start}
.ot h2{font-family:var(--f-d);font-size:2.2rem;line-height:1}
.ot h2 span{font-family:var(--f-ko);font-size:1.2rem;color:var(--hot);margin-left:.5em}
.ot table{width:100%;border-collapse:collapse;font-size:.84rem}
.ot th,.ot td{text-align:left;padding:.3em .4em;border-bottom:1px solid var(--line);vertical-align:top}
.ot th{font-family:var(--f-m);font-weight:400;color:var(--dim);font-size:.72rem}
.ot td.n{text-align:right;font-variant-numeric:tabular-nums}
.ot .st{display:inline-block;min-width:1.6em;text-align:center;font-family:var(--f-m);font-size:.74rem;padding:0 .3em;border:1px solid var(--line);color:var(--dim)}
.ot .st.part{border-color:var(--flash);color:var(--flash)}.ot .st.done{border-color:var(--ok);color:var(--ok)}
#dump{display:none;margin-top:16px}
#dump.on{display:block}
#dump textarea{min-height:16em;font-size:.85rem}

@media (max-width:900px){
  #body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #rail{min-width:0;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;overflow:visible}
  #steps{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:4px}
  #steps button{grid-template-columns:auto auto;align-items:center;padding:.35em .7em}#steps button b{grid-row:auto}#steps button small,#steps button span i{display:none}#steps button span{white-space:nowrap}
  .fu{grid-template-columns:1fr}
  .flow{flex-wrap:wrap}
  #hd{padding:8px 12px}
  #rail .mem{display:none}
  .qcols,.teams,.ogrid{grid-template-columns:1fr}
  #app{grid-template-rows:auto auto 1fr}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<!-- login -->
<section id="login">
  <h1>부스 <em>워크북</em></h1>
  <p class="lede">배운 Claude 사용법을 우리 부스에 써 보는 곳입니다. 프롬프트는 직접 씁니다. 팀을 고르고 이름을 쓰면 시작하고, 쓴 내용은 같은 팀 화면에 바로 보이며 2주차에도 남아 있습니다.</p>
  <div>
    <div class="cap">1 · 팀 선택</div>
    <div class="teams" id="teamSel" role="group" aria-label="팀 선택"></div>
  </div>
  <div class="row">
    <div class="f" style="max-width:420px"><label class="cap" for="nameIn">2 · 이름</label><input type="text" id="nameIn" maxlength="12" autocomplete="off" placeholder="실명으로 (같은 이름이 있으면 뒤에 숫자)"></div>
  </div>
  <div class="row"><button class="hotb" id="enter" type="button" style="font-size:1.3rem;padding:.5em 1.4em">들어가기</button><button id="toOver" type="button">전체 현황 보기</button><span id="loginMsg" role="status"></span></div>
  <div><span class="pill" id="pill0">연결 중</span></div>
</section>

<!-- app -->
<div id="app">
  <div id="hd">
    <div class="brand"><b id="hTeam"></b><span id="hBooth"></span></div>
    <div class="who" id="hWho"></div>
    <span class="pill" id="pill">연결 중</span>
    <button id="btnOver" type="button">전체 현황</button>
    <button id="btnOut" type="button">나가기</button>
  </div>
  <div>
    <div id="now"><span id="nowT"></span><output id="nowC"></output><button id="nowGo" type="button">이 단계로 이동</button><button id="nowF" type="button" aria-pressed="true" style="margin-left:auto">자동 이동 켜짐</button></div>
    <div id="banner" role="status"></div>
  </div>
  <div id="body">
    <nav id="rail" aria-label="단계">
      <div class="seg" role="group" aria-label="주차"><button type="button" data-w="w1" aria-pressed="true">1주차</button><button type="button" data-w="w2" aria-pressed="false">2주차</button></div>
      <div id="steps"></div>
      <div class="mem" id="mem"></div>
    </nav>
    <main id="main"></main>
  </div>
</div>

<!-- overview -->
<section id="over">
  <h1>전체 <em>현황</em></h1>
  <div class="row" style="align-items:center"><span class="pill" id="pill2">연결 중</span><button id="overBack" type="button">돌아가기</button><span id="pinBox" style="display:flex;gap:6px;align-items:center;margin-left:auto"><label class="cap" for="pinIn" style="margin:0">강사 코드</label><input type="text" id="pinIn" inputmode="numeric" maxlength="8" autocomplete="off" style="width:7em"><button type="button" id="pinGo">확인</button></span></div>
  <div class="ctl" id="ctl" hidden>
    <div class="cap">강사 전용 · 모든 학생 화면에 바로 반영됩니다</div>
    <div class="row"><label class="cap" for="ctlStep" style="margin:0">지금 단계</label><select id="ctlStep"></select>
      <button type="button" class="hotb" id="ctlStart">이 단계 시작 (타이머 포함)</button><button type="button" id="ctlStop">타이머 끄기</button><output id="ctlClock" style="font-family:var(--f-d);font-size:1.6rem"></output></div>
  </div>
  <div class="ogrid" id="ogrid"></div>
  <div id="dump"><div class="cap">팀 기록 전체 · 복사해서 보관하세요</div><textarea id="dumpT" readonly></textarea></div>
</section>

<script src="firebase-app-compat.js"></script>
<script src="firebase-database-compat.js"></script>
<script src="steps.js"></script>
<script>
/* ===== 설정: Firebase Realtime Database 주소를 여기에 넣습니다 ===== */
const DB_URL="https://claude-tg-e2e08-default-rtdb.asia-southeast1.firebasedatabase.app";
const CLASS_CODE="wyd-1119-k7q2";   /* 데이터가 저장되는 경로 이름 */
const TEACHER_PIN="4827";           /* 전체 현황의 강사 코드 */
(()=>{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TEAMS=[['t1','1조'],['t2','2조'],['t3','3조']];

const W={}, PEND={}, WAIT={}; let saving=0, isOn=false, everOnline=false, rdbRef=null;
function setPill(){
  const txt=mode==='db'?(!isOn?(everOnline?'연결 끊김':'연결 중'):saving>0?'저장 중':(canWrite?'실시간 공유 중':'저장 거부됨')):mode==='local'?'이 기기에만 저장 중':'연결 중';
  const cls='pill '+(mode==='db'?(!isOn?'local':saving>0?'saving':'db'):mode==='local'?'local':'');
  ['#pill','#pill0','#pill2'].forEach(s=>{const e=$(s); e.textContent=txt; e.className=cls});
}
function banner(msg){const b=$('#banner'); b.textContent=msg||''; b.classList.toggle('on',!!msg); if(view==='login')$('#loginMsg').textContent=msg||''}
function persistLocal(){ if(mode!=='db'||!canWrite) LS.set('wb_cache',{D,CLS}) }
function send(path,data){
  const w=W[path]||(W[path]={busy:false,next:null});
  if(w.busy){w.next=data;return}
  w.busy=true; saving++; setPill();
  db.doc(path).set(data).then(()=>{ if(PEND[path]===data) delete PEND[path] },e=>writeErr(e))
    .finally(()=>{w.busy=false; saving--; if(w.next){const d=w.next; w.next=null; send(path,d)} setPill()});
}
function writeErr(e){
  const c=String((e&&e.code)||'').toUpperCase();
  if(c.includes('PERMISSION')){canWrite=false; banner('공유 저장소가 쓰기를 거부했습니다. 강사에게 알려 주세요. 지금 입력은 이 기기에만 남습니다.'); persistLocal()}
  else banner('저장이 잠시 실패했습니다. 한 글자 더 입력하면 다시 저장합니다.');
}
function put(team,col,id,data){
  D[team][col][id]=data;
  const p=`teams/${team}/${col}/${id}`;
  if(mode==='db'&&canWrite){PEND[p]=data; send(p,data)} else { if(mode==='wait') WAIT[p]=data; persistLocal() }
  refresh();
}
function putClass(data){ CLS=data; if(mode==='db'&&canWrite) send('class/state',data); else persistLocal(); refresh() }
function goLocal(msg){ mode='local'; const c=LS.get('wb_cache',null);
  if(c&&c.D) TEAMS.forEach(([t])=>COLS.forEach(k=>{D[t][k]=Object.assign({},(c.D[t]||{})[k]||{},D[t][k])}));
  if(c&&c.CLS&&!CLS.step) CLS={end:+c.CLS.end||0,step:String(c.CLS.step||''),slide:''};
  banner(msg); setPill(); refresh() }
let loadTimer=0;
function subscribe(){
  loadTimer=setTimeout(()=>banner('아직 공유 데이터를 불러오지 못했습니다. 보이는 내용이 최신이 아닐 수 있습니다.'),10000);
  const got=s=>{ if(loadTimer&&!(s.metadata&&s.metadata.fromCache)){clearTimeout(loadTimer);loadTimer=0; if(canWrite)banner('')} };
  const fail=e=>{ if(loadTimer){clearTimeout(loadTimer);loadTimer=0} goLocal('공유 저장소 연결이 끊겼습니다. 지금 입력은 이 기기에만 남습니다.') };
  TEAMS.forEach(([t])=>COLS.forEach(col=>{
    db.collection(`teams/${t}/${col}`).onSnapshot(s=>{
      const m={}; s.docs.forEach(d=>{m[d.id]=d.data()});
      const pre=`teams/${t}/${col}/`; for(const p in PEND) if(p.startsWith(pre)) m[p.slice(pre.length)]=PEND[p];
      D[t][col]=m; got(s); refresh();
    },fail);
  }));
  db.doc('class/state').onSnapshot(s=>{ const prev=CLS.step; if(s.exists){const d=s.data()||{}; CLS={end:+d.end||0,step:String(d.step||''),slide:String(d.slide||'')}} got(s);
    if(follow&&view==='app'&&CLS.step&&CLS.step!==prev&&CLS.step!==cur&&stepById(CLS.step)) jump(CLS.step); else refresh() },()=>{});
}
function adapter(rdb,base){
  const ref=p=>rdb.ref(base+'/'+p);
  const sub=(p,map)=>(next,err)=>{const r=ref(p); const h=r.on('value',s=>next(map(s)),e=>err&&err({code:'revoked',message:String(e&&e.message||e)})); return ()=>r.off('value',h)};
  return {
    doc:p=>({set:d=>ref(p).set(d),remove:()=>ref(p).remove(),onDisconnectRemove:()=>ref(p).onDisconnect().remove(),
      onSnapshot:sub(p,s=>({exists:s.exists(),data:()=>s.val(),metadata:{fromCache:false}}))}),
    collection:p=>({onSnapshot:sub(p,s=>{const v=s.val()||{}; return {docs:Object.keys(v).map(id=>({id,data:()=>v[id]})),metadata:{fromCache:false}}})})
  };
}

async function connect(){
  if(!DB_URL){ goLocal('아직 공유 저장소가 연결되지 않은 사이트입니다. 지금 입력은 이 기기에만 남습니다.'); return }
  if(!window.firebase||!firebase.initializeApp){ goLocal('공유 저장소 프로그램을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요. 지금 입력은 이 기기에만 남습니다.'); return }
  try{
    firebase.initializeApp({databaseURL:DB_URL}); rdbRef=firebase.database();
    db=adapter(rdbRef,'wb/'+CLASS_CODE);
    isOwner=LS.get('wb_teacher',false)===true;
    mode='db'; setPill(); subscribe();
    for(const p in WAIT){PEND[p]=WAIT[p]; send(p,WAIT[p]); delete WAIT[p]}
    rdbRef.ref('.info/connected').on('value',s=>{ const on=s.val()===true; isOn=on; setPill();
      if(on){ everOnline=true; if($('#banner').textContent.startsWith('인터넷 연결이'))banner(''); if(me&&view==='app')present() }
      else if(everOnline) banner('인터넷 연결이 끊겼습니다. 다시 연결되면 자동으로 저장합니다.'); });
    db.collection('presence').onSnapshot(s=>{ peers=s.docs.map(d=>({presence:d.data()||{}})); refresh() },()=>{});
    refresh();
  }catch(e){ goLocal('공유 저장소에 연결하지 못했습니다. 지금 입력은 이 기기에만 남습니다.') }
}
let presId=null;
function present(){ if(mode!=='db'||!db||!me)return; const id=me.team+'_'+me.key;
  try{ if(presId&&presId!==id) db.doc('presence/'+presId).remove(); presId=id; const d=db.doc('presence/'+id); d.onDisconnectRemove(); d.set({n:me.name,t:me.team}) }catch(e){} }
function absent(){ if(mode==='db'&&db&&presId){ try{db.doc('presence/'+presId).remove()}catch(e){} presId=null } }
function announce(){
  const cur0=D[me.team].members[me.key];
  if(!cur0||cur0.role!==me.role||cur0.name!==me.name) put(me.team,'members',me.key,{name:me.name,role:me.role,at:(cur0&&cur0.at)||Date.now()});
  present();
}

/* ---------- derived ---------- */
const T=()=>D[me.team];
const txt=v=>String((v&&v.text)||'').trim();
const online=team=>new Set(peers.filter(p=>p.presence&&p.presence.t===team).map(p=>String(p.presence.n||'')));
function answersFor(team,fid){return Object.values(D[team].answers).filter(a=>a&&a.q===fid&&txt(a)).sort((a,b)=>(a.at||0)-(b.at||0))}
function draftsFor(team,tid){return Object.values(D[team].drafts).filter(a=>a&&a.t===tid&&txt(a)).sort((a,b)=>(a.at||0)-(b.at||0))}
function followFor(team,sid){return Object.values(D[team].follow).filter(a=>a&&a.s===sid&&txt(a)).sort((a,b)=>(a.at||0)-(b.at||0))}
function ctx(team){
  const d=D[team], miss=t=>MISS+t+MISSEND;
  const all=fid=>{const a=answersFor(team,fid); return a.length?a.map(x=>'- '+txt(x).replace(/\n+/g,' / ')).join('\n'):miss('[아직 아무도 쓰지 않았습니다]')};
  const f=fid=>{const v=txt(d.finals[fid]); if(v) return v; const a=answersFor(team,fid); return a.length?all(fid):miss('미정')};
  const r=(rid,label,where)=>txt(d.results[rid])||miss(`[${where} 단계의 "${label}" 결과가 아직 저장되지 않았습니다]`);
  const mem=Object.values(d.members);
  return {all,f,r,n:mem.length||'여러',booth:txt(d.finals.w1s1_booth)||'[부스 이름]',roster:mem.map(m=>m.name+(m.role?' '+m.role:'')).join(', ')||'팀원 이름과 역할'};
}
const plain=s=>s.split(MISS).join('').split(MISSEND).join('');
const boothOf=team=>txt(D[team].finals.w1s1_booth);
function stepStat(team,s){
  const qs=stepQs(s), rs=stepRs(s), ts=stepTs(s), d=D[team];
  const ans=qs.reduce((n,q)=>n+answersFor(team,q.fid).length,0);
  const dr=ts.reduce((n,t)=>n+draftsFor(team,t.tid).length,0);
  const tp=ts.filter(t=>txt(d.tprompts[t.tid])).length;
  const res=rs.filter(r=>txt(d.results[r.id])).length;
  const fu=followFor(team,s.id).length;
  const ck=Object.values((d.checks[s.id]&&d.checks[s.id].items)||{}).filter(Boolean).length;
  const full=s.lite?(s.checks.length?ck>=s.checks.length:ans>0):(rs.length?res===rs.length&&tp===ts.length:ans>0);
  const state=full?'done':(ans||dr||tp||res||ck)?'part':'';
  return {ans,dr,tp,tpAll:ts.length,res,resAll:rs.length,fu,ck,ckAll:s.checks.length,state};
}
function personStat(team){ const d=D[team], m={}; const add=(n,k)=>{if(!n)return; (m[n]=m[n]||{a:0,p:0,f:0})[k]++};
  Object.values(d.answers).forEach(a=>{if(a&&txt(a))add(a.name,'a')}); Object.values(d.drafts).forEach(a=>{if(a&&txt(a))add(a.name,'p')}); Object.values(d.follow).forEach(a=>{if(a&&txt(a))add(a.name,'f')});
  return n=>m[n]||{a:0,p:0,f:0} }

const typing={}, typingFn={}, refOpen={};
function debounce(key,fn){clearTimeout(typing[key]); typingFn[key]=fn; typing[key]=setTimeout(()=>{delete typing[key]; delete typingFn[key]; fn()},650)}
function flush(key,fn){ if(typing[key]){clearTimeout(typing[key]); delete typing[key]; delete typingFn[key]; fn()} }
function flushAll(){ for(const k in typing){clearTimeout(typing[k]); const f=typingFn[k]; delete typing[k]; delete typingFn[k]; try{f&&f()}catch(e){}} }
function jump(id){ const st=stepById(id); if(!st)return; flushAll(); week=weekOf(st); cur=id; buildStep(); refresh() }
function grow(el){ if(!el||!el.offsetParent)return; el.style.height='auto'; el.style.height=Math.min(el.scrollHeight+2,460)+'px' }
function rolePicker(){ return `<div class="rolebox"><div class="cap">우리 팀 역할 · 자기 역할을 눌러 정합니다</div>
  <p class="hint">팀장은 Claude를 실행하는 사람입니다. 나머지 역할은 파트 제작 단계에서 각자 맡을 파트를 뜻합니다. 인원이 적으면 한 사람이 두 역할을 이어서 맡아도 됩니다.</p>
  <p class="hint">사용량 아끼기: Claude에는 팀장만 보냅니다. 각자의 생각과 프롬프트는 이 워크북에 쓰고, 하나로 정한 뒤에 한 번만 보냅니다.</p>
  <div class="rolegrid" id="roleGrid"></div></div>` }

/* tap handling: act on pointerup so a focused field losing focus cannot swallow the tap */

    const sel=()=>{ta.focus(); ta.select(); done(false)};

    try{navigator.clipboard.writeText(t).then(()=>done(true),sel)}catch(err){sel()}}
});

        if(txt(d.tprompts[tid]))L.push('\n팀 프롬프트 ('+(d.tprompts[tid].by||'')+'):\n'+txt(d.tprompts[tid]));
        if(txt(d.finals[tid+'_diff']))L.push('\n예시와 비교한 소감: '+txt(d.finals[tid+'_diff']))}
      g.results.forEach(r=>{if(txt(d.results[r.id]))L.push('\n[결과] '+r.label+' ('+(d.results[r.id].by||'')+')\n'+txt(d.results[r.id]))})});
    const fu=followFor(t,s.id); if(fu.length){L.push('\n[다시 묻기]'); fu.forEach(a=>L.push('- '+a.name+': '+txt(a)))}});
  $('#dumpT').value=L.join('\n'); $('#dump').classList.add('on'); $('#dumpT').focus(); $('#dumpT').select();
};


/* ---------- init ---------- */
renderLogin(); setPill();
if(me){ $('#nameIn').value=me.name }
connect();
})();
</script>
